[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-module-generator"
version = "0.1.0"
description = "Generate an Odoo 19 module skeleton from the command line"
readme = "README.md"
license = "LGPL-3.0-only"
authors = [{ name = "Koffi Modeste Junior" }]
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
odoo-gen = "odoo_gen.cli:main"

[project.urls]
Homepage = "https://github.com/Junmodeste/odoo-module-generator"

[tool.setuptools.package-data]
odoo_gen = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
